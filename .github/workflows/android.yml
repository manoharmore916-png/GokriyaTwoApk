name: Build Gokriya APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: franchise
            appId: com.gokriya.franchise
            appName: Gokriya Franchise

          - app: plant
            appId: com.gokriya.plant
            appName: Gokriya Plant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract source ZIP
        run: |
          set -e

          ZIP="GokriyaTwoAPK-Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            ls -la
            exit 1
          fi

          rm -rf source
          mkdir source
          unzip -o "$ZIP" -d source

          echo "ZIP extracted successfully"
          find source -maxdepth 4 -type f | head -100

      - name: Find project root
        run: |
          set -e

          PROJECT_ROOT=$(dirname "$(find source -name package.json -type f -print -quit)")

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/package.json" ]; then
            echo "ERROR: package.json not found"
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Prepare app
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Building app: ${{ matrix.app }}"

          rm -rf www android

          mkdir -p www

          if [ ! -f "${{ matrix.app }}/index.html" ]; then
            echo "ERROR: ${{ matrix.app }}/index.html not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          cp "${{ matrix.app }}/index.html" www/index.html

          cat > capacitor.config.json <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "webDir": "www"
          }
          EOF

          echo "Created Capacitor config:"
          cat capacitor.config.json

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          npm install

      - name: Add Android platform
        run: |
          cd "$PROJECT_ROOT"
          npx cap add android --no-interactive

      - name: Ensure Android internet permission
        run: |
          cd "$PROJECT_ROOT"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          echo "Internet permission:"
          grep -n "INTERNET" "$MANIFEST"

      - name: Copy web assets
        run: |
          cd "$PROJECT_ROOT"
          npx cap copy android

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cd "$PROJECT_ROOT"

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "Gokriya-${{ matrix.app }}.apk"

          ls -lh "Gokriya-${{ matrix.app }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokriya-${{ matrix.app }}
          path: ${{ env.PROJECT_ROOT }}/Gokriya-${{ matrix.app }}.apk
