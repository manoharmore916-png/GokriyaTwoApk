name: Build Gokriya APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - franchise
          - plant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q GokriyaTwoAPK-Fixed.zip -d source

      - name: Find project root
        run: |
          if [ -f "source/package.json" ]; then
            echo "PROJECT_DIR=source" >> $GITHUB_ENV
          else
            ROOT=$(find source -name package.json -type f -printf '%h\n' | head -1)
            echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV
          fi

      - name: Prepare app
        run: |
          cd "$PROJECT_DIR"
          rm -rf www
          mkdir -p www

          if [ ! -f "${{ matrix.app }}/index.html" ]; then
            echo "ERROR: ${{ matrix.app }}/index.html not found"
            exit 1
          fi

          cp "${{ matrix.app }}/index.html" www/index.html

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Copy web assets
        run: |
          cd "$PROJECT_DIR"
          npx cap copy android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokriya-${{ matrix.app }}-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
